<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="滤镜">
  <meta name="description" content="暖调复古胶片滤镜">
  <title>滤镜</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
</head>
<body>

  <!-- 首页 -->
  <div id="homeScreen" class="screen">
    <h1 class="app-title">滤 镜</h1>
    <p class="app-subtitle">暖调柔光 · 明亮柔和</p>
    <div class="home-buttons">
      <button id="btnCamera" class="btn-primary">📷 拍照</button>
      <button id="btnGallery" class="btn-secondary">🖼️ 从相册选择</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>
    <p style="color:var(--text-secondary);font-size:11px;margin-top:12px;opacity:0.5;">也可直接粘贴图片</p>
  </div>

  <!-- 编辑页 -->
  <div id="editorScreen" class="screen" style="display:none">
    <div class="editor-toolbar">
      <button id="btnBack" class="btn-icon">←</button>
      <span style="font-size:14px;font-weight:500;">暖调柔光滤镜</span>
      <span style="width:40px"></span>
    </div>

    <div class="editor-preview">
      <img id="editorImage" alt="预览">
      <canvas id="editorCanvas" style="display:none"></canvas>
    </div>

    <div id="slidersPanel" class="sliders-panel"></div>

    <div class="editor-footer">
      <button id="btnCompare" class="footer-btn">
        <span class="icon">👁️</span> 对比原图
      </button>
      <button id="btnReset" class="footer-btn">
        <span class="icon">↺</span> 重置
      </button>
      <button id="btnSave" class="footer-btn primary-action">
        💾 保存照片
      </button>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay"><div class="spinner"></div></div>
  <div id="toast" class="toast"></div>

  <script src="js/filter-engine.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
